<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TSUKIYOMI ツキヨミ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho+B1:wght@400;600;800&display=swap">
<style>
/* Layout: 一画面の儀式。紫の星空 → 呼吸 → 5枚の扇 → 1枚がめくれる → 空がラベンダーに灯り、カードの言葉と今日のヒーリングタイムが届く。
   世界観（紫の宇宙・金の装飾・三日月・羽根・水面の蓮）に統一した単一テーマ。 */
:root{
  --night:#100c2a; --violet:#2a1f63; --lav:#b9a3ef; --lav-soft:#d9cdf7; --pink:#f3a9cb;
  --ink:#f7f1ff; --mist:#cbbfe6; --gold:#ecd08e; --gold-deep:#b48a3c; --veil:rgba(18,13,46,.55);
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --latin:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.9;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

.sky{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 3s ease}
.sky.base{background:radial-gradient(ellipse 90% 60% at 50% 110%,#4a3591 0%,var(--violet) 40%,var(--night) 80%)}
.sky.glow{opacity:0;background:radial-gradient(ellipse 80% 55% at 50% 35%,rgba(185,163,239,.45),transparent 70%),
  radial-gradient(ellipse 120% 50% at 50% 105%,rgba(243,169,203,.35),transparent 70%)}
body.is-open .sky.glow{opacity:1}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

main{position:relative;z-index:1;max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding-block:40px 64px;text-align:center}
.scene{width:100%;display:flex;flex-direction:column;align-items:center;gap:22px;animation:fadein 1.4s both}
.scene[hidden]{display:none!important}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--latin);font-style:italic;letter-spacing:.3em;font-size:14px;color:var(--gold)}
h1{font-weight:800;font-size:clamp(28px,7vw,44px);letter-spacing:.14em;margin:0;line-height:1.4;text-wrap:balance;
  text-shadow:0 0 26px rgba(236,208,142,.4)}
.lead{color:var(--mist);margin:0;max-width:26em;font-size:15px}
.cover{display:block;width:100%;max-width:560px;height:auto;border-radius:18px;margin-top:-16px;
  box-shadow:0 0 0 1px rgba(236,208,142,.35),0 20px 60px rgba(5,3,20,.6),0 0 80px rgba(185,163,239,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.date{font-family:var(--latin);letter-spacing:.2em;color:var(--mist);font-size:15px}

.breath{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center;margin:10px 0}
.breath::before,.breath::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(236,208,142,.6)}
.breath::before{animation:breathe 8s ease-in-out infinite;background:radial-gradient(circle,rgba(217,205,247,.35),transparent 70%)}
.breath::after{inset:-18px;border-color:rgba(236,208,142,.2)}
.breath span{position:relative;font-size:14px;letter-spacing:.3em;color:var(--gold)}
@keyframes breathe{0%,100%{transform:scale(.72)}45%,55%{transform:scale(1.06)}}

.btn{font-family:var(--display);font-size:16px;letter-spacing:.14em;border-radius:999px;padding:13px 30px;cursor:pointer;
  border:1px solid var(--gold);background:linear-gradient(180deg,rgba(236,208,142,.18),rgba(236,208,142,.04));color:var(--ink);
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .3s,box-shadow .3s}
.btn:hover{background:rgba(236,208,142,.25);box-shadow:0 0 22px rgba(236,208,142,.4)}
.btn:focus-visible,.card:focus-visible,.textlink:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.btn.solid{background:linear-gradient(180deg,#f6dea4,var(--gold-deep));color:#241a40;border-color:transparent;font-weight:600}
.textlink{background:none;border:0;color:var(--mist);font-family:var(--display);font-size:13px;letter-spacing:.15em;cursor:pointer;text-decoration:underline;text-underline-offset:5px}

/* カード（SVG絵柄） */
.art{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;box-shadow:0 10px 34px rgba(5,3,20,.6)}
.art svg{display:block;width:100%;height:100%}

.art img{display:block;width:100%;height:100%;object-fit:cover}
.front img{filter:brightness(.62) saturate(1.1)}
.fan{position:relative;width:100%;height:clamp(250px,58vw,330px);margin-top:10px}
.card{--w:clamp(84px,20vw,146px);position:absolute;left:calc(50% - var(--w) / 2);bottom:10px;width:var(--w);aspect-ratio:2/3;max-width:100%;
  border:0;padding:0;background:none;cursor:default;transform-origin:50% 150%;transition:translate .35s cubic-bezier(.2,.8,.2,1),filter .35s}
.fan.ready .card{cursor:pointer}
.fan.ready .card:hover,.fan.ready .card:focus-visible{translate:0 -20px;filter:drop-shadow(0 0 18px rgba(236,208,142,.7))}
.fan.chosen .card{pointer-events:none}
.fan.chosen .card.pick{filter:drop-shadow(0 0 30px rgba(236,208,142,.9))}
.hint{font-size:13px;letter-spacing:.25em;color:var(--gold);min-height:1.6em;transition:opacity .6s}
/* 光の粒 */
.spark{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:5;
  background:radial-gradient(circle,#fff8e4 0 30%,rgba(236,208,142,.8) 45%,transparent 70%)}

.flip{width:clamp(190px,50vw,250px);aspect-ratio:2/3;perspective:1200px;margin-top:6px}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.3,.1,.2,1)}
.flip.turned .flip-inner{transform:rotateY(180deg)}
.flip .front{transform:rotateY(180deg)}
.face-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:16% 10% 0;gap:6px;color:#fff9ef;pointer-events:none}
.face-text .no{font-family:var(--latin);font-size:12px;letter-spacing:.28em;color:var(--gold)}
.face-text .nm{font-size:clamp(19px,5vw,24px);font-weight:800;letter-spacing:.16em;line-height:1.5;text-wrap:balance;text-shadow:0 0 14px rgba(185,163,239,.9)}

/* 読み解き */
.reading{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:34em;opacity:0;transition:opacity 1.6s 1.4s}
.reading.show{opacity:1}
.reading .card-id{font-family:var(--latin);letter-spacing:.26em;font-size:13px;color:var(--gold)}
.reading h2{margin:-10px 0 0;font-size:clamp(26px,6.5vw,34px);font-weight:800;letter-spacing:.12em;text-shadow:0 0 20px rgba(185,163,239,.7)}
.reading .msg{font-size:clamp(17px,4.4vw,20px);font-weight:600;line-height:2.05;margin:0;text-wrap:pretty;max-width:22em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
@media (max-width:420px){.pair{grid-template-columns:1fr}}
.cell{padding:16px 14px;border-radius:14px;background:var(--veil);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(236,208,142,.3);min-width:0}
.cell h3{margin:0 0 4px;font-size:12px;letter-spacing:.22em;color:var(--mist);font-weight:400}
.cell p{margin:0;font-size:18px;font-weight:600}
.cell.up p{color:var(--lav-soft)}
.time{width:100%;padding:20px 18px;border-radius:16px;background:var(--veil);backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1px rgba(236,208,142,.45);display:flex;flex-direction:column;gap:12px}
.time .ttl{font-size:14px;letter-spacing:.3em;color:var(--gold)}
.time .pair .cell{background:rgba(255,255,255,.05);box-shadow:none}
.time .line{margin:0;font-size:15px}
.cta{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 18px;border-radius:16px;
  background:linear-gradient(180deg,rgba(243,169,203,.16),rgba(185,163,239,.10));box-shadow:inset 0 0 0 1px rgba(243,169,203,.4)}
.cta .ttl{font-size:15px;font-weight:600;letter-spacing:.12em}
.cta .rec{font-size:13px;color:var(--mist)}
.cta .btn{width:min(100%,340px)}
.cta .invite{margin:0;font-size:14px;text-align:left}
.share{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.toast{font-size:13px;color:var(--gold);min-height:1.5em}
.note{font-size:11px;color:var(--mist);opacity:.85;margin:0;max-width:34em}

@media (prefers-reduced-motion:reduce){
  .breath::before{animation:none}.card{animation:none;transition:opacity .3s}.flip-inner{transition:none}
  .reading{transition:none}.scene{animation:none}.sky{transition:none}}
</style>

<!-- カードの絵柄パーツ（全カードで共有） -->

<div class="sky base"></div><div class="sky glow"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<main>
  <section class="scene" id="s-intro">
    <h1 class="sr">TSUKIYOMI ツキヨミ 魂のリズムを整えるリーディングカードセッション</h1>
    <img class="cover" src="cover.webp" alt="TSUKIYOMI ツキヨミ｜魂のリズムを整えるリーディングカードセッション">
    <p class="lead">ゆっくり吸って、ゆっくり吐いて。<br>心が静かになったら、今日のあなたに届くカードを呼んでね。</p>
    <button class="btn solid" id="call" type="button">カードを呼ぶ</button>
  </section>

  <section class="scene" id="s-choose" hidden>
    <div class="eyebrow">Choose One</div>
    <p class="lead" id="chooseLead">今日のあなたのために、カードを混ぜているよ。<br>深呼吸をしながら、待っていてね。</p>
    <div class="fan" id="fan"></div>
    <div class="hint" id="hint" aria-live="polite"></div>
  </section>

  <section class="scene" id="s-read" hidden>
    <div class="flip" id="flip">
      <div class="flip-inner">
        <div class="art" id="flipBack"></div>
        <div class="art front" id="flipFront"></div>
      </div>
    </div>
    <div class="reading" id="reading"></div>
  </section>
</main>

<script>
/* ===== 設定：ご自身のYouTube情報に書き換えてください ===== */
const CHANNEL_NAME = "ヒーリングサプリ";
const CHANNEL_URL  = "https://www.youtube.com/@nacchannel123";   // 例: "https://www.youtube.com/@xxxx"（空ならYouTube検索）

};

const VIDEO_URLS = {};
/* ============================================================ */

// [カード名, 今日のメッセージ, 乱れやすい周波数, 活性化したい周波数, 時間帯, 視聴時間, 音楽へつなぐ一言, 再生リスト]
const CARDS = [
 ["心の静寂","たくさんの声に囲まれる日こそ、まずは静けさに戻ってね。答えは、あなたの内側にちゃんとあるよ。","思考の騒がしさ","静けさ・内なる声","朝の支度前","5分","朝の静けさの中で、心の声を聴いてみて。","morning"],
 ["手放しの風","握りしめているものを、少しだけ緩めてみて。\n手放した分だけ、新しい風が入ってくるよ。","執着・握りしめ","解放・軽やかさ","眠る前","15分","今日抱えたものを、音楽と一緒に手放して。","sleep"],
 ["涙の浄化","泣きたい気持ちは弱さじゃないよ。涙は、心をきれいにしてくれる浄化の水。","悲しみの溜めこみ","浄化・感情の解放","夜のひとり時間","15分","感情を無理に抑えず、優しい音に包まれて。","cleanse"],

 ["怒りの奥の願い","怒りは、本当は大切にしたい何かがあるサイン。その奥の願いを見つけてあげてね。","怒り・イライラ","本音・自己理解","夕方","10分","今日の怒りの奥にある本音に耳を傾けて。","cleanse"],
 ["比較からの卒業","誰かと比べなくて大丈夫。あなたの花は、あなたのタイミングで咲くよ。","比較・劣等感","自分軸","朝","5分","誰かではなく、自分の人生に意識を戻そう。","morning"],
 ["許しの光","許すことは、相手のためじゃなく自分を自由にするため。少しずつで大丈夫だよ。","わだかまり・罪悪感","許し・心の自由","眠る前","15分","心に残る重たい感情を優しく見つめて。","sleep"],
 ["本音の目覚め","「本当はどうしたい？」と自分に聞いてみて。その小さな声が、今日の道しるべ。","我慢・本音の抑えこみ","本音・自己表現","朝","10分","今日の自分が本当に望むことを感じてみて。","morning"],

/* 光の粒をはじけさせる */
function sparkle(el,n=26){
  if(reduce)return;const r=el.getBoundingClientRect(),cx0=r.left+r.width/2,cy0=r.top+r.height/2;
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="spark";s.style.left=cx0+"px";s.style.top=cy0+"px";
    document.body.appendChild(s);const a=Math.random()*6.283,d=60+Math.random()*Math.max(r.width,120),sz=.6+Math.random()*1.6;
    s.animate([{transform:`translate(-50%,-50%) scale(${sz})`,opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`,opacity:0}],
      {duration:900+Math.random()*700,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove();}
}

/* 背景の星空 */
const cv=$("stars"),cx=cv.getContext("2d");let stars=[];
function sizeSky(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:Math.round(innerWidth*innerHeight/3200)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:.4+Math.random()*1.2,g:Math.random()>.85}));}
function drawSky(t){cx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){cx.globalAlpha=.3+.7*Math.abs(Math.sin(s.p+t*.0006*s.s));cx.fillStyle=s.g?"#f3d9a0":"#f4eeff";cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();}
  if(!reduce)requestAnimationFrame(drawSky);}
sizeSky();addEventListener("resize",sizeSky);requestAnimationFrame(drawSky);

const ANG=[-24,-12,0,12,24];
const fanT = i => `translate(0,0) rotate(${ANG[i]}deg)`;

/* シャッフル → 5枚に広がる */
function buildFan(){
  const fan=$("fan");fan.className="fan";fan.innerHTML="";
  $("chooseLead").innerHTML="今日のあなたのために、カードを混ぜているよ。<br>深呼吸をしながら、待っていてね。";
  $("hint").textContent="";
  const TOTAL=11, cards=[];
  for(let i=0;i<TOTAL;i++){
    const b=document.createElement("button");b.type="button";b.className="card";b.tabIndex=-1;
    b.innerHTML=`<div class="art">${BACK}</div>`;b.style.zIndex=i;
    fan.appendChild(b);cards.push(b);
  }
  const done=()=>{
    cards.slice(5).forEach(b=>b.remove());
    cards.slice(0,5).forEach((b,i)=>{b.tabIndex=0;b.setAttribute("aria-label",`${i+1}枚目のカードを選ぶ`);b.onclick=()=>choose(b);});
    fan.classList.add("ready");
    $("chooseLead").innerHTML="5枚のカードが現れたよ。<br>理由はいらないの。いちばん心が惹かれる一枚に、そっと触れてね。";
    $("hint").textContent="✦ 一枚を選んでね ✦";
  };
  if(reduce){cards.slice(0,5).forEach((b,i)=>b.style.transform=fanT(i));done();return;}

  // ① 山札が左右に分かれては重なる（3回）
  const D=2600;
  cards.forEach((b,i)=>{
    const side=i%2?1:-1,stack=`translate(0,${-i*1.2}px) rotate(0deg)`;
    const out=`translate(${side*62}%,${-i*1.2-10}px) rotate(${side*9}deg)`;
    const kf=[{transform:`translate(0,40px) rotate(0deg)`,opacity:0},{transform:stack,opacity:1,offset:.12}];
    [.24,.42,.6].forEach((o,k)=>{kf.push({transform:out,offset:o});kf.push({transform:`translate(0,${-((i*7+k*3)%TOTAL)*1.2}px) rotate(${(i%3-1)*2}deg)`,offset:o+.09});});
    kf.push({transform:stack,offset:.88,opacity:1});
    kf.push(i<5?{transform:stack,opacity:1}:{transform:`translate(0,-6px) scale(.9)`,opacity:0});
    b.animate(kf,{duration:D,delay:i*35,easing:"ease-in-out",fill:"forwards"});
  });
  // ② 5枚が扇のように広がる
  setTimeout(()=>{
    cards.slice(0,5).forEach((b,i)=>{
      b.getAnimations().forEach(a=>a.cancel());
      b.animate([{transform:`translate(0,${-i*1.2}px) rotate(0deg)`},{transform:`translate(0,-14px) rotate(${ANG[i]*1.15}deg)`,offset:.7},{transform:fanT(i)}],
        {duration:900,delay:i*90,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"});
    });
    cards.slice(5).forEach(b=>b.style.opacity=0);
    setTimeout(()=>{sparkle(fan,18);done();},900+4*90);
  },D+TOTAL*35);
}

/* 選んだ瞬間：ふわっと浮かんで、震えて、光がはじける */
function choose(b){
  const fan=$("fan");fan.classList.remove("ready");fan.classList.add("chosen");b.classList.add("pick");
  $("hint").textContent="";$("chooseLead").innerHTML="あなたのカードが、目を覚ましているよ…";
  const i=[...fan.children].indexOf(b);
  const idx=Math.floor(Math.random()*CARDS.length);   // 50枚の意味からランダムに1枚
  try{localStorage.setItem(todayKey,idx)}catch(e){}
  if(reduce){reveal(idx,true);return;}
  [...fan.children].forEach((c,k)=>{ if(c===b)return;
    c.animate([{transform:fanT(k),opacity:1},{transform:`translate(${(k-i)*40}px,60px) rotate(${ANG[k]*1.6}deg) scale(.85)`,opacity:0}],
      {duration:800,easing:"ease-in",fill:"forwards"});});
  b.style.zIndex=20;
  b.animate([
    {transform:fanT(i)},
    {transform:`translate(0,-50px) rotate(0deg) scale(1.15)`,offset:.35},
    {transform:`translate(0,-50px) rotate(-3deg) scale(1.15)`,offset:.48},
    {transform:`translate(0,-50px) rotate(3deg) scale(1.15)`,offset:.6},
    {transform:`translate(0,-50px) rotate(-2deg) scale(1.15)`,offset:.72},
    {transform:`translate(0,-56px) rotate(0deg) scale(1.2)`}
  ],{duration:1500,easing:"ease-in-out",fill:"forwards"});
  setTimeout(()=>sparkle(b,34),700);
  setTimeout(()=>reveal(idx,true),1700);
}

    </div>
    <div class="cta">
      <div class="ttl">今日のあなたにおすすめのヒーリングソング</div>
      <div class="rec">おすすめ：${when}に${len}　／　${p.name}</div>
      <a class="btn solid" href="${songUrl}" target="_blank" rel="noopener">ヒーリングサプリを聴く ♡</a>
      <p class="invite">${INVITE[slot(when)].replace(/\n/g,"<br>")}</p>
      <div class="rec">動画が長いときは、最初の${len.replace(/^.*〜/,"")}だけ聴いてもOKだよ</div>
      <a class="btn" href="${subUrl}" target="_blank" rel="noopener">毎日カードを引いて周波数を整えていこう✨</a>
    </div>
    <div class="share">
      <a class="textlink" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">Xでシェア</a>
      <a class="textlink" href="https://line.me/R/share?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">LINEで送る</a>
      <button class="textlink" id="copy" type="button">言葉をコピー</button>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <p class="note">明日の朝、また新しいカードを引きに来てね。</p>
    <button class="textlink" id="again" type="button">もう一度カードを呼ぶ</button>
    <p class="note">視聴時間は医学的な治療時間ではなく、無理なく音楽を楽しめる目安です。メッセージや音楽はリラックスや内観のためのもので、効果を保証するものではありません。</p>`;
  $("copy").onclick=()=>navigator.clipboard.writeText(shareText).then(()=>$("toast").textContent="コピーしたよ",()=>$("toast").textContent="コピーできませんでした");
  $("again").onclick=()=>{try{localStorage.removeItem(todayKey)}catch(e){}document.body.classList.remove("is-open");show("s-choose");buildFan();};
  const go=()=>{flip.classList.add("turned");document.body.classList.add("is-open");$("reading").classList.add("show");
    if(animate)setTimeout(()=>sparkle(flip,40),800);};
  animate&&!reduce ? setTimeout(go,500) : go();
}

$("call").addEventListener("click",()=>{show("s-choose");buildFan();});

// いつも表紙から始める。今日すでに引いていたら、表紙に「今日のカードを見る」を出す
let saved=null;try{saved=localStorage.getItem(todayKey)}catch(e){}
if(saved!==null&&CARDS[+saved]){
  const b=document.createElement("button");b.type="button";b.className="textlink";b.textContent="今日引いたカードをもう一度見る";
  b.onclick=()=>reveal(+saved,false);$("call").after(b);
}
</script>

</html>
